# Burp Remote —— 插件界面文本（简体中文 zh）
#
# 键集合必须与 messages.properties 完全一致：少一个键，界面上就会出现一串英文资源键，
# 而那种缺失通常只在切换系统语言之后才被发现。LocalisedTextTest 会比对三份资源束的键集合。
#
# 编码：JDK 9 起 ResourceBundle 以 UTF-8 读取属性文件，中文直接写原文即可。

# —— 顶部状态 ——
pending_endpoint_notice=远程端点尚未开放：需先完成设备配对与身份认证

# —— 配对区 ——
pairing_section_heading=设备配对
pairing_code_caption=配对码
pairing_instruction=用移动端扫描左侧二维码，或在移动端手动输入配对码
pairing_validity_remaining=有效期至 {0}（剩余 {1}）
remaining_duration={0} 分 {1} 秒
pairing_code_expired=已过期，请刷新配对码
refresh_pairing_code_label=刷新配对码
copy_pairing_code_label=复制配对码

# —— 运行参数区 ——
runtime_section_heading=运行参数
protocol_version_label=协议版本
advertised_address_label=配对地址
remote_port_label=预留监听端口

# —— 已配对设备区 ——
paired_device_section_heading=已配对设备
paired_device_empty_notice=暂无已配对设备
paired_device_paired_at=配对于 {0}
remove_paired_device_label=移除
paired_device_removed_notice=已移除设备 {0}

# —— 操作反馈 ——
copy_succeeded_notice=配对码已复制到剪贴板
copy_unavailable_notice=剪贴板不可用，请手动抄写配对码
