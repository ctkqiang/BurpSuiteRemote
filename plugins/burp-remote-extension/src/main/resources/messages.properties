# Burp Remote —— 插件界面文本（默认语言 en）
#
# 本文件是基础资源束，也是所有未提供翻译的语言的兜底：操作系统语言为法语、日语时，
# 界面回落到的正是这里的英文，而不是一串资源键。
#
# 编码：JDK 9 起 ResourceBundle 以 UTF-8 读取属性文件，因此这里直接写原文即可，
# 不需要 \uXXXX 转义。切勿用 Properties.load 直接读本文件——那个入口仍按 ISO-8859-1 解码。
#
# 键名约定：snake_case（与 rules.md §3.3 中资源命名的约定一致）。
# 带占位符的取值一律使用位置参数 {0}、{1}，由 MessageFormat 处理，禁止字符串拼接。

# —— 顶部状态 ——
pending_endpoint_notice=The remote endpoint is not open yet: device pairing and authentication must be completed first

# —— 配对区 ——
pairing_section_heading=Device pairing
pairing_code_caption=Pairing code
pairing_instruction=Scan the QR code on the left with the mobile app, or type the pairing code there
pairing_validity_remaining=Expires at {0} ({1} remaining)
remaining_duration={0} min {1} sec
pairing_code_expired=Expired — refresh the pairing code
refresh_pairing_code_label=Refresh pairing code
copy_pairing_code_label=Copy pairing code

# —— 运行参数区 ——
runtime_section_heading=Runtime parameters
protocol_version_label=Protocol version
advertised_address_label=Pairing address
remote_port_label=Reserved listening port

# —— 已配对设备区 ——
paired_device_section_heading=Paired devices
paired_device_empty_notice=No device is paired yet
paired_device_paired_at=Paired at {0}
remove_paired_device_label=Remove
paired_device_removed_notice=Removed device {0}

# —— 操作反馈 ——
copy_succeeded_notice=Pairing code copied to the clipboard
copy_unavailable_notice=The clipboard is unavailable — write the pairing code down manually
