# Burp Remote —— 插件侧构建属性。
#
# 本文件只存放与构建环境有关的开关。它坚决不存放任何密钥、令牌或凭据，
# 因为构建属性会被完整打进构建缓存，也会出现在诊断日志中。

# 构建 JVM 参数：锁定 UTF-8 编码，保证中文注释与中文日志不会变成乱码。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# 并行执行任务，缩短完整校验的耗时。
org.gradle.parallel=true

# 复用任务输出，避免重复编译与重复静态分析。
org.gradle.caching=true

# Kotlin 官方代码风格，与 .editorconfig 中的缩进约定共同生效。
kotlin.code.style=official
