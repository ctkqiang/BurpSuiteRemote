name: Release

# 打 tag（v0.1.0 这种）就触发：编插件 JAR 和手机 APK，挂到 GitHub Release 上。
#
# 插件走 packageExtension（ktlint + detekt + 单元测试 + shadowJar 绑成一个动作），
# 保证「有产物」与「产物合格」同义；APK 走 assembleDebug。
# 产物目录被 plugins/build.gradle.kts 与 client/mobileapp/build.gradle.kts 重定向到
# 仓库根的 build/ 下，收集步骤的 find 路径跟着这个约定走。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension JAR
        working-directory: plugins
        run: ./gradlew --console=plain packageExtension

      - name: Build Android APK
        working-directory: client/mobileapp
        run: ./gradlew --console=plain assembleDebug

      - name: Gather artifacts
        run: |
          mkdir -p artifacts
          # 只取 fat JAR，跳过不带依赖的 -plain 瘦 JAR
          find build/plugins/burp-remote-extension/libs -maxdepth 1 \
            -name '*.jar' ! -name '*-plain.jar' -exec cp {} artifacts/ \;
          find build/mobileapp/app/outputs/apk/debug -maxdepth 1 \
            -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.jar
            artifacts/*.apk
