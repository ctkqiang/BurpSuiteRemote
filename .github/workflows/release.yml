name: Release

# 打 tag（v0.1.0 这种）就触发：编插件 JAR、签名 APK 与 AAB，一起挂到 GitHub Release 上。
#
# 插件走 packageExtension（ktlint + detekt + 单元测试 + shadowJar 绑成一个动作），
# 保证「有产物」与「产物合格」同义。
# 手机端走 packageReleaseDistribution：用公钥签名，同时产出 APK 与 AAB，
# 并按 {项目名}{版本号}.{扩展名} 归集，因此发布页上是 BurpRemote0.1.0.{jar,apk,aab}。
#
# 需要的仓库 Secret（缺一不可；缺失时构建直接失败，而不是悄悄产出未签名的包）：
#   ANDROID_KEYSTORE_BASE64    密钥库文件（.jks）的 base64 编码
#   ANDROID_KEYSTORE_PASSWORD  密钥库口令
#   ANDROID_KEY_ALIAS          密钥别名
#   ANDROID_KEY_PASSWORD       密钥口令
#
# 密钥库生成一次即可长期复用（务必离线备份，丢失后无法再对已上架应用升级）：
#   keytool -genkeypair -v -keystore release.jks -alias burpremote \
#     -keyalg RSA -keysize 4096 -validity 10000
#   base64 -i release.jks   # macOS；把输出整段粘进 ANDROID_KEYSTORE_BASE64
#
# 产物目录被 plugins/build.gradle.kts 与 client/mobileapp/build.gradle.kts 重定向到
# 仓库根的 build/ 下，收集步骤的路径跟着这个约定走。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension JAR
        working-directory: plugins
        run: ./gradlew --console=plain packageExtension

      # 密钥库以 Secret 形式存放，构建时还原成文件，用完即删。
      # 四个变量分开校验：少配一个就立刻失败，避免拿着空口令去签出一个坏包。
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::仓库 Secret ${name} 未配置，release 无法用公钥签名。" >&2
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > client/mobileapp/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > client/mobileapp/keystore.properties
          chmod 600 client/mobileapp/release.jks client/mobileapp/keystore.properties

      - name: Build signed APK and AAB
        working-directory: client/mobileapp
        run: ./gradlew --console=plain packageReleaseDistribution

      # 无论构建成败都清掉签名材料：runner 是一次性的，但日志与后续步骤没理由再见它。
      - name: Remove signing material
        if: always()
        run: rm -f client/mobileapp/release.jks client/mobileapp/keystore.properties

      # 直接收集 outputs/dist 与插件 libs：这两处的文件名已经是最终名字，
      # 不在这里做二次改名，命名契约只有 Gradle 一个事实来源。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/plugins/burp-remote-extension/libs/BurpRemote*.jar
            build/mobileapp/app/outputs/dist/BurpRemote*.apk
            build/mobileapp/app/outputs/dist/BurpRemote*.aab
