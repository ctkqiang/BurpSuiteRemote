name: Release

# 打 tag（v0.1.0 这种）就触发：编插件 JAR 和手机 APK，挂到 GitHub Release 上。
# 不跑测试——CI 平时已经在跑，发版只是打包；万一闸门红了就不该打 tag。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build extension JAR
        working-directory: plugins
        run: ./gradlew --console=plain packageExtension

      - name: Build Android APK
        working-directory: client/mobileapp
        run: ./gradlew --console=plain assembleDebug

      - name: Gather artifacts
        run: |
          mkdir -p artifacts
          cp build/plugins/burp-remote-extension/libs/burp-remote-extension-*.jar \
             $(ls build/plugins/burp-remote-extension/libs/*.jar | grep -v plain) \
             artifacts/ 2>/dev/null || true
          # 只留 fat JAR，plain 的扔掉
          find build/plugins/burp-remote-extension/libs -name '*.jar' ! -name '*-plain.jar' \
             -exec cp {} artifacts/ \;
          cp build/mobileapp/app/outputs/apk/debug/*.apk artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.jar
            artifacts/*.apk
