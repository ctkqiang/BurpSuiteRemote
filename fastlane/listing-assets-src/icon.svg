<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play 商店图标（512×512）的来源文件。

  内容与 Android 端的自适应图标完全同源：背景 #FF6633 + 前景「中继」标记。
  三处必须保持一致，改动其中一处就要同步其余两处：
    client/mobileapp/app/src/main/res/values/colors.xml          (ic_launcher_background)
    client/mobileapp/app/src/main/res/drawable/ic_launcher_foreground.xml  (前景路径)
    本文件                                                       (两者合成的商店图标)

  视口为什么是 "18 18 72 72"：
  自适应图标的画布是 108dp，其中只有中心 72dp 是可见区，其余是给各家启动器
  做裁切/视差用的余量。商店图标只需呈现可见区，因此直接把中心 72dp 映射到
  512×512，等于 512/72 ≈ 7.111 倍缩放；图形尺寸与手机上看到的比例一致。

  生成命令（rsvg-convert 是唯一能把矢量忠实栅格化的工具，ImageMagick 的内置
  MSVG 渲染器对 stroke-linejoin 的处理不可靠，不要用 magick 直接转换）：
    rsvg-convert -w 512 -h 512 icon.svg -o ../metadata/android/en-US/images/icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="512" height="512">
  <!-- 背景层：铺满整个可见区，不留任何透明边缘，否则部分启动器会透出底色 -->
  <rect x="18" y="18" width="72" height="72" fill="#FF6633"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 方框（代理）：自右边缘缺口上沿起笔，逆时针绕回缺口下沿 -->
    <path d="M76,47 L76,40 L68,32 L40,32 L32,40 L32,68 L40,76 L68,76 L76,68 L76,61"/>
    <!-- 箭头杆：从框内穿过缺口伸出框外 -->
    <path d="M43,54 L78,54"/>
    <!-- 箭头头部 -->
    <path d="M68,44 L78,54 L68,64"/>
  </g>
</svg>
